<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="435" viewBox="0 0 900 435" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Alarma y autorrecarga en cero</title><desc id="descripcion">Cuenta ascendente hasta 500000; se genera aviso y se vuelve a cero cada medio segundo. Rampa conceptual de un contador discreto.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#222" /></marker></defs><rect width="900" height="435" fill="white" /><g font-family="Arial, sans-serif" fill="black"><text x="450" y="35" font-size="24" text-anchor="middle">Alarma y autorrecarga en cero</text><line x1="90" y1="285" x2="850" y2="285" stroke="#222" stroke-width="2" /><line x1="90" y1="285" x2="90" y2="65" stroke="#222" stroke-width="2" /><line x1="90" y1="100" x2="820" y2="100" stroke="#222" stroke-width="2" stroke-dasharray="6 5" /><text x="50" y="105" font-size="20" text-anchor="middle">A</text><text x="65" y="285" font-size="20" text-anchor="middle">0</text><text x="125" y="70" font-size="18" text-anchor="middle">Cuenta</text><path d="M90 280 L330 100 V280 L570 100 V280 L810 100 V280" fill="none" stroke="#111" stroke-width="3" /><text x="90" y="315" font-size="18" text-anchor="middle">0</text><text x="330" y="315" font-size="18" text-anchor="middle">0,5 s</text><circle cx="330" cy="100" r="4" fill="black" /><line x1="330" y1="107" x2="330" y2="340" stroke="#222" stroke-width="2" stroke-dasharray="6 5" /><text x="330" y="365" font-size="18" text-anchor="middle">Aviso</text><text x="570" y="315" font-size="18" text-anchor="middle">1,0 s</text><circle cx="570" cy="100" r="4" fill="black" /><line x1="570" y1="107" x2="570" y2="340" stroke="#222" stroke-width="2" stroke-dasharray="6 5" /><text x="570" y="365" font-size="18" text-anchor="middle">Aviso</text><text x="810" y="315" font-size="18" text-anchor="middle">1,5 s</text><circle cx="810" cy="100" r="4" fill="black" /><line x1="810" y1="107" x2="810" y2="340" stroke="#222" stroke-width="2" stroke-dasharray="6 5" /><text x="810" y="365" font-size="18" text-anchor="middle">Aviso</text><text x="450" y="405" font-size="18" text-anchor="middle">f = 1 MHz · A = 500 000 ticks · recarga R = 0 · período = 0,5 s</text><polygon points="850.00,285.00 839.00,280.50 839.00,289.50" fill="#222" /><polygon points="90.00,65.00 85.50,76.00 94.50,76.00" fill="#222" /></g></svg>