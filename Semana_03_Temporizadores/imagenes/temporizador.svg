<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="415" viewBox="0 0 900 415" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Del reloj al aviso del temporizador</title><desc id="descripcion">Reloj de entrada, divisor, contador, comparador con registro de alarma y evento.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#222" /></marker></defs><rect width="900" height="415" fill="white" /><g font-family="Arial, sans-serif" fill="black"><text x="450" y="35" font-size="24" text-anchor="middle">Del reloj al aviso del temporizador</text><rect x="20" y="100" width="140" height="95" rx="5" fill="white" stroke="#222" stroke-width="2" /><text x="90.0" y="140.5" font-size="19" text-anchor="middle">Reloj</text><text x="90.0" y="166.5" font-size="19" text-anchor="middle">80 MHz</text><rect x="200" y="100" width="140" height="95" rx="5" fill="white" stroke="#222" stroke-width="2" /><text x="270.0" y="140.5" font-size="19" text-anchor="middle">Prescaler</text><text x="270.0" y="166.5" font-size="19" text-anchor="middle">÷ N</text><rect x="380" y="100" width="140" height="95" rx="5" fill="white" stroke="#222" stroke-width="2" /><text x="450.0" y="140.5" font-size="19" text-anchor="middle">Contador</text><text x="450.0" y="166.5" font-size="19" text-anchor="middle">+1 por tick</text><rect x="560" y="100" width="140" height="95" rx="5" fill="white" stroke="#222" stroke-width="2" /><text x="630.0" y="140.5" font-size="19" text-anchor="middle">Comparador</text><text x="630.0" y="166.5" font-size="19" text-anchor="middle">Cuenta = A</text><rect x="740" y="100" width="140" height="95" rx="5" fill="white" stroke="#222" stroke-width="2" /><text x="810.0" y="140.5" font-size="19" text-anchor="middle">Evento</text><text x="810.0" y="166.5" font-size="19" text-anchor="middle">Aviso / ISR</text><line x1="160" y1="148" x2="200" y2="148" stroke="#222" stroke-width="2" /><line x1="340" y1="148" x2="380" y2="148" stroke="#222" stroke-width="2" /><line x1="520" y1="148" x2="560" y2="148" stroke="#222" stroke-width="2" /><line x1="700" y1="148" x2="740" y2="148" stroke="#222" stroke-width="2" /><text x="180" y="240" font-size="17" text-anchor="middle">Pulsos</text><text x="360" y="240" font-size="17" text-anchor="middle">Ticks</text><rect x="550" y="290" width="160" height="55" rx="5" fill="white" stroke="#222" stroke-width="2" /><text x="630.0" y="323.5" font-size="19" text-anchor="middle">Alarma A</text><line x1="630" y1="290" x2="630" y2="195" stroke="#222" stroke-width="2" /><text x="450" y="385" font-size="17" text-anchor="middle">La CPU configura; el periférico cuenta. Modelo usado en los ejercicios.</text><polygon points="200.00,148.00 189.00,143.50 189.00,152.50" fill="#222" /><polygon points="380.00,148.00 369.00,143.50 369.00,152.50" fill="#222" /><polygon points="560.00,148.00 549.00,143.50 549.00,152.50" fill="#222" /><polygon points="740.00,148.00 729.00,143.50 729.00,152.50" fill="#222" /><polygon points="630.00,195.00 625.50,206.00 634.50,206.00" fill="#222" /></g></svg>