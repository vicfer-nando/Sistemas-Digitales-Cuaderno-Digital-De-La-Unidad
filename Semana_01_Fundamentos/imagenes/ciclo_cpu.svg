<svg xmlns="http://www.w3.org/2000/svg" width="900" height="275" viewBox="0 0 900 275" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Ciclo conceptual de la CPU</title><desc id="descripcion">Búsqueda, decodificación y ejecución con retorno a la b?squeda siguiente.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#222" /></marker></defs><rect width="900" height="275" fill="white" /><g font-family="Arial, sans-serif" fill="black"><text x="450" y="35" font-size="24" text-anchor="middle">Ciclo conceptual de la CPU</text><rect x="65" y="80" width="230" height="85" rx="5" fill="white" stroke="#222" stroke-width="2" /><text x="180.0" y="115.5" font-size="19" text-anchor="middle">Buscar</text><text x="180.0" y="141.5" font-size="19" text-anchor="middle">Obtener instrucción</text><rect x="335" y="80" width="230" height="85" rx="5" fill="white" stroke="#222" stroke-width="2" /><text x="450.0" y="115.5" font-size="19" text-anchor="middle">Decodificar</text><text x="450.0" y="141.5" font-size="19" text-anchor="middle">Interpretar operación</text><rect x="605" y="80" width="230" height="85" rx="5" fill="white" stroke="#222" stroke-width="2" /><text x="720.0" y="115.5" font-size="19" text-anchor="middle">Ejecutar</text><text x="720.0" y="141.5" font-size="19" text-anchor="middle">Operar y actualizar</text><line x1="295" y1="122" x2="335" y2="122" stroke="#222" stroke-width="2" /><line x1="565" y1="122" x2="605" y2="122" stroke="#222" stroke-width="2" /><path d="M720 165 V205 H180 V165" fill="none" stroke="#111" stroke-width="3" /><line x1="180" y1="205" x2="180" y2="167" stroke="#222" stroke-width="2" /><text x="450" y="245" font-size="18" text-anchor="middle">El reloj coordina el avance; una instrucción puede usar varios ciclos.</text><polygon points="335.00,122.00 324.00,117.50 324.00,126.50" fill="#222" /><polygon points="605.00,122.00 594.00,117.50 594.00,126.50" fill="#222" /><polygon points="180.00,167.00 175.50,178.00 184.50,178.00" fill="#222" /></g></svg>