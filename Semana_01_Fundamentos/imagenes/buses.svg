<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="445" viewBox="0 0 900 445" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Organización conceptual de los buses</title><desc id="descripcion">CPU, memoria y entrada/salida conectadas mediante funciones de dirección, datos y control. El dato puede viajar en ambos sentidos.</desc><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="black" /></marker></defs><rect width="900" height="445" fill="white" /><g font-family="Arial, sans-serif" fill="black"><text x="450" y="35" font-size="24" text-anchor="middle">CPU, memoria y entrada / salida</text><rect x="40" y="150" width="150" height="190" fill="white" stroke="black" stroke-width="2" /><text x="115.0" y="252.0" font-size="19" text-anchor="middle">CPU</text><rect x="360" y="75" width="200" height="65" fill="white" stroke="black" stroke-width="2" /><text x="460.0" y="114.5" font-size="19" text-anchor="middle">Memoria</text><rect x="650" y="75" width="200" height="65" fill="white" stroke="black" stroke-width="2" /><text x="750.0" y="114.5" font-size="19" text-anchor="middle">Entrada / salida</text><line x1="190" y1="210" x2="850" y2="210" stroke="#222" stroke-width="2" /><text x="215" y="200" font-size="17" text-anchor="start">Direcciones</text><line x1="410" y1="140" x2="410" y2="210" stroke="#222" stroke-width="2" /><circle cx="410" cy="210" r="3" fill="black" /><line x1="700" y1="140" x2="700" y2="210" stroke="#222" stroke-width="2" /><circle cx="700" cy="210" r="3" fill="black" /><line x1="190" y1="255" x2="850" y2="255" stroke="#222" stroke-width="2" /><text x="215" y="245" font-size="17" text-anchor="start">Datos</text><line x1="460" y1="140" x2="460" y2="255" stroke="#222" stroke-width="2" /><circle cx="460" cy="255" r="3" fill="black" /><line x1="750" y1="140" x2="750" y2="255" stroke="#222" stroke-width="2" /><circle cx="750" cy="255" r="3" fill="black" /><line x1="190" y1="300" x2="850" y2="300" stroke="#222" stroke-width="2" /><text x="215" y="290" font-size="17" text-anchor="start">Control</text><line x1="510" y1="140" x2="510" y2="300" stroke="#222" stroke-width="2" /><circle cx="510" cy="300" r="3" fill="black" /><line x1="800" y1="140" x2="800" y2="300" stroke="#222" stroke-width="2" /><circle cx="800" cy="300" r="3" fill="black" /><text x="450" y="385" font-size="18" text-anchor="middle">Direcciones: dónde · Datos: contenido · Control: operación</text><text x="450" y="415" font-size="17" text-anchor="middle">Esquema conceptual: las líneas agrupan señales, no cables literales.</text><polygon points="850.00,210.00 839.00,205.50 839.00,214.50" fill="#222" /><polygon points="850.00,255.00 839.00,250.50 839.00,259.50" fill="#222" /><polygon points="190.00,255.00 201.00,259.50 201.00,250.50" fill="#222" /><polygon points="850.00,300.00 839.00,295.50 839.00,304.50" fill="#222" /></g></svg>