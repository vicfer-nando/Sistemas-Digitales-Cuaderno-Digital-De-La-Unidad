<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="445" viewBox="0 0 900 445" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Arquitectura de un microcontrolador</title><desc id="descripcion">CPU, memorias y periféricos integrados. Esquema funcional, no disposición física.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#222" /></marker></defs><rect width="900" height="445" fill="white" /><g font-family="Arial, sans-serif" fill="black"><text x="450" y="35" font-size="24" text-anchor="middle">Arquitectura de un microcontrolador</text><rect x="25" y="60" width="850" height="330" rx="8" fill="none" stroke="#777" stroke-width="2" /><rect x="60" y="90" width="280" height="120" rx="5" fill="white" stroke="#222" stroke-width="2" /><text x="200.0" y="143.0" font-size="19" text-anchor="middle">CPU</text><text x="200.0" y="169.0" font-size="19" text-anchor="middle">ALU · registros · PC</text><rect x="545" y="90" width="280" height="120" rx="5" fill="white" stroke="#222" stroke-width="2" /><text x="685.0" y="143.0" font-size="19" text-anchor="middle">Memorias</text><text x="685.0" y="169.0" font-size="19" text-anchor="middle">Flash · SRAM · EEPROM</text><rect x="290" y="280" width="320" height="70" rx="5" fill="white" stroke="#222" stroke-width="2" /><text x="450.0" y="321.0" font-size="19" text-anchor="middle">Periféricos: GPIO · timer · UART</text><line x1="340" y1="150" x2="545" y2="150" stroke="#222" stroke-width="2" /><line x1="545" y1="175" x2="340" y2="175" stroke="#222" stroke-width="2" /><text x="443" y="125" font-size="16" text-anchor="middle">Comunicación</text><line x1="200" y1="210" x2="200" y2="315" stroke="#222" stroke-width="2" /><line x1="200" y1="315" x2="290" y2="315" stroke="#222" stroke-width="2" /><line x1="685" y1="210" x2="685" y2="315" stroke="#222" stroke-width="2" /><line x1="685" y1="315" x2="610" y2="315" stroke="#222" stroke-width="2" /><text x="450" y="420" font-size="17" text-anchor="middle">Modelo funcional: los bloques dependen del dispositivo.</text><polygon points="545.00,150.00 534.00,145.50 534.00,154.50" fill="#222" /><polygon points="340.00,175.00 351.00,179.50 351.00,170.50" fill="#222" /><polygon points="290.00,315.00 279.00,310.50 279.00,319.50" fill="#222" /><polygon points="610.00,315.00 621.00,319.50 621.00,310.50" fill="#222" /></g></svg>