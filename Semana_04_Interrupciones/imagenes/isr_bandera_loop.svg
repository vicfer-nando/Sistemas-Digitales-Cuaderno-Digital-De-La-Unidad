<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="425" viewBox="0 0 900 425" role="img" aria-labelledby="titulo descripcion"><title id="titulo">ISR → aviso → loop()</title><desc id="descripcion">La ISR registra un dato compartido; loop toma el aviso con protección y realiza el trabajo fuera de la ISR y de la sección crítica.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#222" /></marker></defs><rect width="900" height="425" fill="white" /><g font-family="Arial, sans-serif" fill="black"><text x="450" y="35" font-size="24" text-anchor="middle">ISR → aviso → loop()</text><rect x="35" y="100" width="190" height="95" rx="5" fill="white" stroke="#222" stroke-width="2" /><text x="130.0" y="140.5" font-size="19" text-anchor="middle">ISR breve</text><text x="130.0" y="166.5" font-size="19" text-anchor="middle">Registrar aviso</text><rect x="355" y="100" width="190" height="95" rx="5" fill="white" stroke="#222" stroke-width="2" /><text x="450.0" y="140.5" font-size="19" text-anchor="middle">Dato compartido</text><text x="450.0" y="166.5" font-size="19" text-anchor="middle">Bandera o contador</text><rect x="675" y="100" width="190" height="95" rx="5" fill="white" stroke="#222" stroke-width="2" /><text x="770.0" y="140.5" font-size="19" text-anchor="middle">loop()</text><text x="770.0" y="166.5" font-size="19" text-anchor="middle">Procesar trabajo</text><line x1="225" y1="148" x2="355" y2="148" stroke="#222" stroke-width="2" /><line x1="545" y1="148" x2="675" y2="148" stroke="#222" stroke-width="2" /><text x="450" y="240" font-size="18" text-anchor="middle">Proteger escritura y copia / limpieza con el mismo mecanismo.</text><rect x="245" y="285" width="410" height="65" rx="5" fill="white" stroke="#222" stroke-width="2" /><text x="450.0" y="323.5" font-size="19" text-anchor="middle">Trabajo diferido: imprimir y comunicar</text><line x1="770" y1="195" x2="770" y2="318" stroke="#222" stroke-width="2" /><line x1="770" y1="318" x2="655" y2="318" stroke="#222" stroke-width="2" /><text x="450" y="395" font-size="18" text-anchor="middle">Una bandera conserva presencia; un contador conserva cantidad.</text><polygon points="355.00,148.00 344.00,143.50 344.00,152.50" fill="#222" /><polygon points="675.00,148.00 664.00,143.50 664.00,152.50" fill="#222" /><polygon points="655.00,318.00 666.00,322.50 666.00,313.50" fill="#222" /></g></svg>