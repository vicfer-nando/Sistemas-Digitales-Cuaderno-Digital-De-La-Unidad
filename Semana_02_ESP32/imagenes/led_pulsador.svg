<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="titulo descripcion"><title id="titulo">LED y pulsador: conexiones de referencia</title><desc id="descripcion">LED desde GPIO16 con resistencia de 330 ohmios y cátodo a GND. Entrada GPIO21 con pull-up externa de 10 kiloohmios a 3,3 V y pulsador a GND.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#222" /></marker></defs><rect width="900" height="450" fill="white" /><g font-family="Arial, sans-serif" fill="black"><text x="450" y="35" font-size="24" text-anchor="middle">LED y pulsador: conexiones de referencia</text><text x="225" y="80" font-size="21" text-anchor="middle">Salida: LED activo en alto</text><text x="675" y="80" font-size="21" text-anchor="middle">Entrada: pull-up externa</text><text x="65" y="145" font-size="18" text-anchor="middle">GPIO16</text><line x1="40" y1="180" x2="130" y2="180" stroke="#222" stroke-width="2" /><rect x="130" y="166" width="70" height="28" fill="white" stroke="black" stroke-width="2" /><text x="165" y="145" font-size="18" text-anchor="middle">330 Ω</text><line x1="200" y1="180" x2="260" y2="180" stroke="#222" stroke-width="2" /><path d="M260 160 L260 200 L292 180 Z" fill="white" stroke="black" stroke-width="2" /><line x1="295" y1="157" x2="295" y2="203" stroke="#222" stroke-width="2" /><line x1="295" y1="180" x2="365" y2="180" stroke="#222" stroke-width="2" /><line x1="365" y1="180" x2="365" y2="280" stroke="#222" stroke-width="2" /><line x1="365" y1="280" x2="365" y2="292" stroke="#222" stroke-width="2" /><line x1="348" y1="292" x2="382" y2="292" stroke="#222" stroke-width="2" /><line x1="354" y1="300" x2="376" y2="300" stroke="#222" stroke-width="2" /><line x1="360" y1="308" x2="370" y2="308" stroke="#222" stroke-width="2" /><text x="260" y="225" font-size="17" text-anchor="middle">A</text><text x="302" y="225" font-size="17" text-anchor="middle">K</text><text x="275" y="255" font-size="18" text-anchor="middle">LED</text><line x1="280" y1="150" x2="302" y2="128" stroke="#222" stroke-width="2" /><line x1="300" y1="150" x2="322" y2="128" stroke="#222" stroke-width="2" /><text x="365" y="340" font-size="18" text-anchor="middle">GND</text><text x="640" y="115" font-size="18" text-anchor="middle">3,3 V</text><line x1="640" y1="125" x2="640" y2="145" stroke="#222" stroke-width="2" /><rect x="626" y="145" width="28" height="55" fill="white" stroke="black" stroke-width="2" /><text x="705" y="178" font-size="18" text-anchor="middle">10 kΩ</text><line x1="640" y1="200" x2="640" y2="225" stroke="#222" stroke-width="2" /><circle cx="640" cy="225" r="4" fill="black" /><line x1="640" y1="225" x2="770" y2="225" stroke="#222" stroke-width="2" /><rect x="770" y="205" width="100" height="40" rx="5" fill="white" stroke="#222" stroke-width="2" /><text x="820.0" y="231.0" font-size="19" text-anchor="middle">GPIO21</text><line x1="640" y1="225" x2="640" y2="255" stroke="#222" stroke-width="2" /><circle cx="640" cy="255" r="4" fill="black" /><circle cx="640" cy="292" r="4" fill="black" /><line x1="640" y1="292" x2="667" y2="261" stroke="#222" stroke-width="2" /><line x1="640" y1="292" x2="640" y2="322" stroke="#222" stroke-width="2" /><line x1="640" y1="322" x2="640" y2="334" stroke="#222" stroke-width="2" /><line x1="623" y1="334" x2="657" y2="334" stroke="#222" stroke-width="2" /><line x1="629" y1="342" x2="651" y2="342" stroke="#222" stroke-width="2" /><line x1="635" y1="350" x2="645" y2="350" stroke="#222" stroke-width="2" /><text x="752" y="283" font-size="18" text-anchor="middle">Pulsador</text><text x="752" y="308" font-size="17" text-anchor="middle">a GND</text><text x="640" y="380" font-size="18" text-anchor="middle">GND</text><text x="450" y="425" font-size="17" text-anchor="middle">Las dos referencias GND se conectan a GND de la placa ESP32.</text><polygon points="302.00,128.00 291.04,132.60 29