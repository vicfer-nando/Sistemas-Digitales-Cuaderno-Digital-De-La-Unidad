<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Antirrebote por estabilidad</title><desc id="descripcion">La señal oscila al presionar y queda en bajo; el estado filtrado cambia tras 30 milisegundos sin cambios observados.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#222" /></marker></defs><rect width="900" height="440" fill="white" /><g font-family="Arial, sans-serif" fill="black"><text x="450" y="35" font-size="24" text-anchor="middle">Antirrebote por estabilidad</text><text x="75" y="110" font-size="18" text-anchor="middle">Señal</text><text x="75" y="280" font-size="18" text-anchor="middle">Filtrada</text><path d="M140 100 H260 V160 H280 V100 H300 V160 H325 V100 H350 V160 H810" fill="none" stroke="#111" stroke-width="3" /><path d="M140 270 H650 V330 H810" fill="none" stroke="#111" stroke-width="3" /><line x1="350" y1="185" x2="650" y2="185" stroke="#222" stroke-width="2" /><line x1="350" y1="177" x2="350" y2="193" stroke="#222" stroke-width="2" /><line x1="650" y1="177" x2="650" y2="193" stroke="#222" stroke-width="2" /><text x="500" y="218" font-size="18" text-anchor="middle">30 ms sin cambios observados</text><line x1="650" y1="70" x2="650" y2="350" stroke="#222" stroke-width="2" stroke-dasharray="6 5" /><text x="690" y="370" font-size="18" text-anchor="middle">Aceptar LOW</text><text x="285" y="65" font-size="18" text-anchor="middle">Rebote</text><text x="450" y="410" font-size="17" text-anchor="middle">Esquema conceptual; no es una señal medida ni está a escala.</text></g></svg>