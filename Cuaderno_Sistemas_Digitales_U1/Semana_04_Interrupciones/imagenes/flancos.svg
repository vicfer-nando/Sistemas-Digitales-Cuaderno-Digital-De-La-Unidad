<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="385" viewBox="0 0 900 385" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Flancos de un pulsador con pull-up</title><desc id="descripcion">Señal alta en reposo, flanco de bajada al presionar y flanco de subida al soltar. Señal ideal sin rebote.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#222" /></marker></defs><rect width="900" height="385" fill="white" /><g font-family="Arial, sans-serif" fill="black"><text x="450" y="35" font-size="24" text-anchor="middle">Flancos de un pulsador con pull-up</text><text x="70" y="135" font-size="18" text-anchor="middle">HIGH</text><text x="70" y="225" font-size="18" text-anchor="middle">LOW</text><path d="M140 120 H320 V210 H610 V120 H820" fill="none" stroke="#111" stroke-width="3" /><line x1="320" y1="70" x2="320" y2="110" stroke="#222" stroke-width="2" /><text x="300" y="60" font-size="18" text-anchor="middle">FALLING: 1 → 0</text><line x1="610" y1="265" x2="610" y2="220" stroke="#222" stroke-width="2" /><text x="620" y="295" font-size="18" text-anchor="middle">RISING: 0 → 1</text><text x="205" y="260" font-size="18" text-anchor="middle">Suelto</text><text x="465" y="175" font-size="18" text-anchor="middle">Presionado</text><text x="730" y="260" font-size="18" text-anchor="middle">Suelto</text><text x="450" y="350" font-size="18" text-anchor="middle">CHANGE detecta ambos flancos; el rebote puede agregar más.</text><polygon points="320.00,110.00 324.50,99.00 315.50,99.00" fill="#222" /><polygon points="610.00,220.00 605.50,231.00 614.50,231.00" fill="#222" /></g></svg>